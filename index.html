<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Today</title>
  <meta name="theme-color" content="#E6ECE4" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <!-- iOS home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Today" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    html, body { margin: 0; background: #E6ECE4; -webkit-tap-highlight-color: transparent; }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    input, select, button { font-family: inherit; }
    button:focus-visible, input:focus-visible { outline: 2px solid #2F6F4E; outline-offset: 2px; }
    #loading { font-family: system-ui, sans-serif; color: #1F2A22; opacity: .5; text-align: center; padding: 60px 20px; }
  </style>
</head>
<body>
  <div id="root"><div id="loading">Loading…</div></div>
  <script src="./tasks.js"></script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator && !window.origin.startsWith("capacitor")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
